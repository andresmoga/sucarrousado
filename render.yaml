# Render Blueprint: en Render, "New > Blueprint" y elija este repositorio.
# Crea la base PostgreSQL y el servicio web (Docker). Las variables con sync: false se llenan en el panel.
databases:
  - name: carrousado-db
    plan: basic-256mb
    region: virginia
    databaseName: carrousado
    user: cu
    postgresMajorVersion: "16"

services:
  - type: web
    name: carrousado
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    domains:
      - sucarrousado.com
      - www.sucarrousado.com
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carrousado-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: PLATE_HASH_SALT
        generateValue: true
      - key: PUBLIC_URL
        value: https://sucarrousado.com
      - key: SITE_MODE
        value: beta
      - key: BETA_INVITE_CODE
        sync: false
      - key: VEHICLE_DATA_PROVIDER
        value: none
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LEGAL_NAME
        sync: false
      - key: LEGAL_ID
        sync: false
      - key: LEGAL_EMAIL
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_CITY
        sync: false
      - key: LEGAL_PHONE
        sync: false
